<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACE Scratch Connector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">MACE <span>// SCRATCH CONNECTOR</span></div>
    <div id="status" class="status">Checking connection…</div>
  </header>
  <main>
    <button id="refresh" class="secondary">Refresh variables</button>
    <label for="search">Find a variable</label>
    <input id="search" placeholder="Search coins, score, lives…">
    <label for="variables">Game variables</label>
    <select id="variables" size="7"></select>
    <div class="selected" id="selected">Select a variable to edit it.</div>
    <label for="value">Value</label>
    <input id="value" type="number" step="any" value="1000">
    <div class="buttons">
      <button id="set">Set value</button>
      <button id="add" class="secondary">Add value</button>
      <button id="reset" class="danger">Set to 0</button>
    </div>
    <p id="message" role="status"></p>
    <p class="note">For your own Scratch projects only. Changes affect the running editor session and may reset after reloading the project.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
